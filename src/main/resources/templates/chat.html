<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chat')}"></head>
<body class="bg-slate-50">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto grid max-w-6xl gap-6 px-5 py-8 md:grid-cols-[240px_1fr]">
    <aside class="rounded-2xl border bg-white p-4"><a href="/chat"
                                                      class="block rounded-lg bg-slate-900 px-3 py-2 text-center text-sm font-semibold text-white">New
        chat</a>
        <div class="mt-4 space-y-1"><a th:each="s : ${sessions}" th:href="@{/chat(session=${s.id})}"
                                       class="block truncate rounded px-2 py-2 text-sm hover:bg-slate-100"
                                       th:text="${s.title}">Session</a></div>
    </aside>
    <section class="flex min-h-[70vh] flex-col rounded-2xl border bg-white">
        <div id="messages" class="flex-1 space-y-5 p-6" th:data-session="${activeSession}">
            <div th:if="${messages == null}" class="py-20 text-center text-slate-500">Ask a question about your indexed
                documents.
            </div>
            <article th:each="m : ${messages}" class="max-w-3xl rounded-xl p-4"
                     th:classappend="${m.role == 'USER'} ? ' ml-auto bg-slate-900 text-white' : ' bg-slate-100'"><p
                    class="mb-1 text-xs font-bold uppercase opacity-60" th:text="${m.role}">USER</p>
                <p class="whitespace-pre-wrap" th:text="${m.content}">Message</p></article>
        </div>
        <form id="chat-form" class="border-t p-4">
            <div class="flex gap-3"><input id="question" class="min-w-0 flex-1 rounded-lg border px-4 py-3"
                                           placeholder="Ask about your documents…" autocomplete="off">
                <button class="rounded-lg bg-cyan-500 px-5 font-semibold text-slate-950">Send</button>
            </div>
            <p id="chat-status" class="mt-2 text-sm text-red-600"></p></form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
