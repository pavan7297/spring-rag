<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Upload')}"></head>
<body class="bg-slate-50">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto max-w-2xl px-5 py-12"><h1 class="text-3xl font-bold">Add knowledge</h1>
    <p class="mt-2 text-slate-600">PDF, DOCX, TXT, or Markdown up to 25 MB. The text is chunked and embedded
        automatically.</p>
    <form id="upload-form" class="mt-8 rounded-2xl border-2 border-dashed border-slate-300 bg-white p-10 text-center">
        <input id="file" name="file" type="file" accept=".pdf,.docx,.txt,.md" class="mx-auto block max-w-full">
        <button class="mt-6 rounded-lg bg-slate-900 px-5 py-2 font-semibold text-white">Upload & index</button>
        <p id="upload-status" class="mt-4 text-sm"></p></form>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
